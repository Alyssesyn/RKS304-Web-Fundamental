<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Simple</title>
    <!-- CDN Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <!-- Diubah dari max-w-md menjadi max-w-2xl agar tampilan lebih lebar -->
    <!-- Ganti max-w-2xl menjadi max-w-xl (atau max-w-lg) -->
<div class="bg-purple-950/80 border border-purple-500/30 p-6 sm:p-8 rounded-2xl w-full max-w-xl shadow-lg shadow-purple-900/50">
        
        <!-- Box khusus untuk highlight judul Form Registrasi -->
        <div class="bg-purple-900/60 border border-purple-500/40 p-4 rounded-xl text-center mb-6 shadow-inner">
            <h2 class="text-2xl font-bold text-purple-200 tracking-wide uppercase">Form Registrasi</h2>
        </div>

        <!-- Action mengarah ke dashboard.html -->
        <form id="formRegister" action="dashboard.html" method="GET" class="space-y-4">
            
            <!-- Username -->
            <div>
                <label class="block text-sm font-medium mb-1">Username</label>
                <input type="text" id="username" name="username" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-purple-400">
                <p id="errUsername" class="text-red-400 text-xs mt-1 hidden"></p>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" name="password" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-purple-400">
                <p id="errPassword" class="text-red-400 text-xs mt-1 hidden"></p>
            </div>

            <!-- Nama -->
            <div>
                <label class="block text-sm font-medium mb-1">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-purple-400">
                <p id="errNama" class="text-red-400 text-xs mt-1 hidden"></p>
            </div>

            <!-- Tanggal Lahir -->
            <div>
                <label class="block text-sm font-medium mb-1">Tanggal Lahir</label>
                <input type="date" id="tglLahir" name="tglLahir" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-purple-400 [color-scheme:dark]">
                <p id="errTglLahir" class="text-red-400 text-xs mt-1 hidden"></p>
            </div>

            <!-- Alamat -->
            <div>
                <label class="block text-sm font-medium mb-1">Alamat</label>
                <textarea id="alamat" name="alamat" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-purple-400"></textarea>
                <p id="errAlamat" class="text-red-400 text-xs mt-1 hidden"></p>
            </div>

            <!-- Nomor Telepon -->
            <div>
                <label class="block text-sm font-medium mb-1">Nomor Telepon (Depan: 62)</label>
                <input type="text" id="noTelp" name="noTelp" placeholder="62812345678" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-purple-400">
                <p id="errNoTelp" class="text-red-400 text-xs mt-1 hidden"></p>
            </div>

            <!-- Tombol Submit -->
            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 font-semibold py-2.5 rounded-lg transition-colors mt-2 shadow-md shadow-purple-900/50">
                Daftar
            </button>
        </form>
    </div>

    <!-- Panggil file JS terpisah -->
    <script src="validasi_input.js"></script>
</body>
</html>

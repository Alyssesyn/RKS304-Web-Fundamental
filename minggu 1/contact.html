<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intan Kurnia Salsabil | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="navbar">
      <div class="logo">INTAN KURNIA SALSABIL</div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <h2 class="section-title">Formulir Kontak &amp; Kolaborasi</h2>

      <form class="contact-form" action="#" method="post">

        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
        </div>

        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" required>
        </div>

        <div class="form-group">
          <label for="kategori">Kategori / Keperluan</label>
          <select id="kategori" name="kategori" required>
            <option value="" disabled selected>Pilih keperluan</option>
            <option value="konsultasi">Konsultasi</option>
            <option value="kolaborasi">Kolaborasi Proyek</option>
            <option value="pertanyaan">Pertanyaan Umum</option>
          </select>
        </div>

        <div class="form-group">
          <label for="pesan">Pesan</label>
          <textarea id="pesan" name="pesan" rows="5" placeholder="Tulis pesan Anda di sini..." required></textarea>
        </div>

        <button type="submit">Kirim Pesan</button>

      </form>
    </section>
  </main>

  <footer>&copy; 2026 Intan Kurnia Salsabil. Tugas Praktikum Web Fundamental.</footer>

</body>
</html>
